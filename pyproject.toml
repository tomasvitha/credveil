[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credveil"
version = "0.2.0"
description = "Inline credential guard for LLM agents working on network devices"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[project.scripts]
credveil = "credveil.cli:main"

[tool.setuptools.packages.find]
include = ["credveil*"]
